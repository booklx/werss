name: Build WeRSS Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 关键修复：锁定 pnpm 9 版本，并忽略严格的 peer 依赖与 lockfile 校验
      - name: Fix Dockerfile for pnpm compatibility
        run: |
          sed -i 's/npm install -g pnpm/npm install -g pnpm@9/g' Dockerfile
          sed -i 's/--frozen-lockfile/--no-frozen-lockfile --strict-peer-dependencies=false/g' Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/werss:latest
